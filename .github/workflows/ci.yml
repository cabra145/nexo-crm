# =============================================================================
#  Nexo CRM · Integración continua
# -----------------------------------------------------------------------------
#  Dos trabajos en paralelo:
#
#    Calidad      formato · lint · tipos · build de producción
#    Integración  base de datos VACÍA → migraciones → RLS → seed → prueba de
#                 aislamiento → API → worker → autenticación → prueba de humo
#                 → web en producción + pruebas de navegador → cierre ordenado
#
#  La integración ejecuta infra/scripts/ci-integration.sh, el mismo script que
#  se puede lanzar en local: lo que pasa aquí se puede reproducir en un Mac.
#
#  Las acciones están fijadas por hash de commit, no por etiqueta: una etiqueta
#  como `v7` puede moverse a otro código; un hash no. El comentario al lado de
#  cada una dice qué versión es.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sólo lectura del repositorio: el CI no publica, no etiqueta, no comenta.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sin `version`: toma la de `packageManager` en package.json (pnpm 12.4.2),
      # así CI y los equipos de desarrollo usan exactamente la misma.
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: si package.json y pnpm-lock.yaml no coinciden, falla
      # en vez de resolver versiones nuevas por su cuenta.
      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Tipos
        run: pnpm turbo run typecheck

      - name: Build de producción
        run: pnpm turbo run build
        env:
          # La web valida esta variable al compilar; en CI no hay .env.
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  # ---------------------------------------------------------------------------
  integration:
    name: Integración
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Credenciales de usar y tirar: sólo existen durante esta ejecución, en
    # contenedores que se destruyen al terminar. No son secretos del proyecto.
    env:
      DATABASE_URL: postgresql://nexo_app:ci_app_password@localhost:5432/nexo?schema=public
      DIRECT_DATABASE_URL: postgresql://nexo:ci_owner_password@localhost:5432/nexo?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILPIT_URL: http://localhost:8025
      CI_LOG_DIR: ${{ github.workspace }}/.ci-logs

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexo
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=es-EC --encoding=UTF8
        ports:
          - 5432:5432
        # `-h 127.0.0.1` a propósito: durante la inicialización, Postgres arranca
        # un servidor temporal que sólo escucha por socket local. Comprobando por
        # TCP, la sonda no da "listo" hasta que arranca el servidor definitivo.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexo -d nexo"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      # API, worker y los paquetes de los que dependen. La web la compila el
      # propio script: su NEXT_PUBLIC_API_URL depende de la API de la prueba.
      - name: Build de API y worker
        run: pnpm turbo run build --filter=@nexo/api --filter=@nexo/worker

      # La versión del navegador la fija @playwright/test en el lockfile.
      # --with-deps instala también las librerías del sistema que necesita.
      - name: Chromium para las pruebas de navegador
        run: pnpm --filter @nexo/web exec playwright install --with-deps --no-shell chromium

      - name: Integración completa
        run: bash infra/scripts/ci-integration.sh

      - name: Logs de API y worker
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-integracion
          path: |
            .ci-logs/
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
